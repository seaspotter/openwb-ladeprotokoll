<script src="/static/vendor/htmx-2.0.11.min.js"></script>
<style>
  /* [hidden] alone loses to any selector that sets `display` with equal or
     higher specificity (e.g. `.inline { display: flex }` on a form that
     also carries `hidden`) -- the browser's own [hidden] rule in the UA
     stylesheet doesn't win a specificity fight against page CSS. Without
     this, the add-source/add-price forms below stayed visible even before
     the "+" button was ever clicked. */
  [hidden] { display: none !important; }
  /* [open] here matters, not just style: the UA stylesheet hides a
     <dialog> via `dialog:not([open]) { display: none }`, and an
     unqualified `dialog#settings-modal { display: flex }` (ID selector)
     outranks that on specificity -- forcing display:flex even while
     closed, so .close() removed the open/modal/backdrop state but the
     panel stayed visibly stuck on the page. Same category of bug as the
     `[hidden]` note below, just the <dialog> version of it -- this was a
     real shipped regression, caught from a user report of "can't close
     the settings window" right after the flex-column scrollbar fix. */
  dialog#settings-modal[open] {
    width: min(760px, 92vw);
    max-height: 88vh;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    /* flex column + overflow:hidden here, flex:1 + its own overflow-y on
       .modal-body below -- lets the body's scroll area size itself off
       the header's actual rendered height instead of a hardcoded
       `calc(88vh - 56px)` guess, which could be a few px short of the
       real header height and left both the dialog and .modal-body
       scrollable at once (two nested scrollbars for one panel). */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  dialog#settings-modal::backdrop { background: rgba(0, 0, 0, 0.45); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-header h2 { margin: 0; font-size: 15px; }
  .modal-body { padding: 4px 18px 18px; overflow-y: auto; flex: 1; min-height: 0; }
  .modal-body .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin: 14px 0;
  }
  .modal-body .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .modal-body .panel-header h3 { font-size: 13px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .modal-body h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .modal-body .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .modal-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .modal-body th, .modal-body td { text-align: left; padding: 5px 7px; border-bottom: 1px solid var(--border); }
  .modal-body th { color: var(--muted); font-weight: 500; }
  .modal-body .status-ok { color: var(--ok); }
  .modal-body .status-error { color: var(--error); }
  .modal-body form.inline { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
  .modal-body .add-form { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .modal-body input[type=text], .modal-body input[type=number], .modal-body input[type=date],
  .modal-body input[type=month], .modal-body input[type=time], .modal-body select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .modal-body input[type=text] { min-width: 160px; }
  .modal-body input[type=number] { width: 90px; }
  .modal-body button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; cursor: pointer;
  }
  .modal-body button:hover { border-color: var(--accent); }
  .modal-body button.danger:hover { border-color: var(--error); color: var(--error); }
  .modal-body button.icon-btn {
    width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center;
    justify-content: center; font-size: 16px; line-height: 1;
  }
  .modal-body .muted { color: var(--muted); font-size: 12px; }
  .modal-body .columns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; margin-bottom: 10px; }
  /* Every <label> in the modal -- not just checkbox ones -- gets the same
     13px/inline-flex/gap treatment, so "Kosten-Spalte zeigt:", "PV-Preis
     (€/kWh):" etc. sit at the same size as everything around them instead
     of falling back to the body's larger default font (a real visual
     inconsistency caught from a user screenshot: labels without a class
     rendered noticeably bigger than the buttons/inputs/table text next to
     them). */
  .modal-body label {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  }
  .modal-body input[type=checkbox] {
    width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; margin: 0;
  }
  .header-icon-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; text-decoration: none;
  }
  .header-icon-btn:hover { border-color: var(--accent); }
</style>

<dialog id="settings-modal">
  <div class="modal-header">
    <h2>Einstellungen</h2>
    <button type="button" class="icon-btn" id="settings-close" title="Schließen">&times;</button>
  </div>
  <div class="modal-body">

    <div class="panel">
      <div id="sources-panel" hx-get="/hx/sources" hx-trigger="modal-opened from:body once, sources-changed from:body" hx-swap="innerHTML"></div>
    </div>

    <div class="panel">
      <div id="prices-panel" hx-get="/hx/prices" hx-trigger="modal-opened from:body once, sources-changed from:body" hx-swap="innerHTML"></div>
    </div>

    <div class="panel">
      <div id="vehicles-panel" hx-get="/hx/vehicles" hx-trigger="modal-opened from:body once" hx-swap="innerHTML"></div>
    </div>

    <div class="panel">
      <div id="backfill-panel" hx-get="/hx/backfill" hx-trigger="modal-opened from:body once, sources-changed from:body" hx-swap="innerHTML"></div>
    </div>

    <div class="panel">
      <div id="report-settings-panel" hx-get="/hx/report-settings" hx-trigger="modal-opened from:body once" hx-swap="innerHTML"></div>
    </div>

    <div class="panel">
      <h3>Update</h3>
      <div id="update-panel" hx-get="/hx/update" hx-trigger="modal-opened from:body once" hx-swap="innerHTML"></div>
      <p class="muted" id="update-msg"></p>
    </div>

  </div>
</dialog>

<script>
async function api(url, opts) {
  const resp = await fetch(url, opts);
  const contentType = resp.headers.get('content-type') || '';
  const isJson = contentType.includes('application/json');
  if (!resp.ok) {
    const body = isJson ? await resp.json().catch(() => ({})) : {};
    throw new Error(body.detail || resp.statusText);
  }
  return isJson ? resp.json() : resp.text();
}

// Delegated on .modal-body (never itself replaced, unlike its htmx-swapped
// panel children) -- one listener survives every fragment re-render,
// instead of each panel needing to rebind its own "+" toggle after load.
document.querySelector('.modal-body').addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-toggle-form]');
  if (!btn) return;
  const form = document.getElementById(btn.dataset.toggleForm);
  if (form) form.hidden = !form.hidden;
});

// Update panel's restart-poll (see hx/update/panel.html's "restarting"
// state): htmx keeps retrying /hx/update/ping on its own every 2s, this
// just gives up with a fallback message after ~30 failed attempts rather
// than polling silently forever if the restart genuinely never completes.
function handleUpdatePingFailure(ev) {
  const el = ev.target;
  if (!el.hasAttribute || !el.hasAttribute('data-update-ping')) return;
  const attempts = parseInt(el.dataset.attempts || '0', 10) + 1;
  if (attempts >= 30) {
    el.remove();
    document.getElementById('update-msg').textContent = 'Startet noch... bitte in Kürze manuell neu laden.';
  } else {
    el.dataset.attempts = attempts;
  }
}
document.body.addEventListener('htmx:sendError', handleUpdatePingFailure);
document.body.addEventListener('htmx:responseError', handleUpdatePingFailure);

const settingsModal = document.getElementById('settings-modal');

document.getElementById('settings-close').addEventListener('click', () => settingsModal.close());

document.querySelectorAll('[data-open-settings]').forEach((btn) => {
  btn.addEventListener('click', () => {
    settingsModal.showModal();
    document.body.dispatchEvent(new Event('modal-opened'));
  });
});

// Theme toggle: an explicit override on top of the CSS `prefers-color-scheme`
// default, persisted per-browser in localStorage so it survives reloads
// and applies across all three pages (same origin).
function currentTheme() {
  return document.documentElement.dataset.theme
    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

// Same SVG icon markup as this author's other projects (openwb-logger,
// knxpilot) -- a color emoji glyph (🌙/☀️) renders as an odd, inconsistently
// shaped pill depending on the OS/browser emoji font, unlike these plain
// `currentColor` outlines which always match the rest of the toolbar.
const SUN_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/>' +
  '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">' +
  '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';

function updateThemeIcon() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.innerHTML = currentTheme() === 'dark' ? MOON_ICON : SUN_ICON;
}

document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    updateThemeIcon();
  });
});
updateThemeIcon();
</script>
