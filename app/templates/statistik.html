<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Statistik – openWB Ladeprotokoll</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316a34a'/%3E%3Cpath d='M13 3 5 14h5l-1 7 8-11h-5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe2;
    --text: #1a1d24; --muted: #6b7280; --accent: #2563eb;
    --ok: #1e7a42; --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
      --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
      --ok: #5fbd82; --error: #e5675f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
    --ok: #5fbd82; --error: #e5675f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon { display: flex; flex-shrink: 0; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-mark { font-weight: 700; color: #16a34a; }
  .nav-spacer { margin-left: auto; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  a.nav-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; text-decoration: none;
    display: inline-flex; align-items: center; cursor: pointer;
  }
  a.nav-btn:hover { border-color: var(--accent); }
  main { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .totals-grid .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .totals-grid .stat .label { font-size: 11px; color: var(--muted); }
  .totals-grid .stat .value { font-size: 15px; font-weight: 600; }
  .chart-wrap { position: relative; height: 320px; }
  .empty-hint { padding: 24px; text-align: center; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.numeric, th.numeric { text-align: right; }
</style>
</head>
<body>
<script>
try {
  const stored = localStorage.getItem('theme');
  if (stored) document.documentElement.dataset.theme = stored;
} catch (e) {}
</script>
<header>
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#16a34a"/><path d="M13 3 5 14h5l-1 7 8-11h-5z" fill="white"/></svg>
    </span>
    <h1><span class="brand-mark">openWB</span> Ladeprotokoll</h1>
  </div>
  <span class="nav-spacer"></span>
  <div class="header-actions">
    <a href="/" class="nav-btn">&larr; Übersicht</a>
    <button type="button" class="header-icon-btn" id="theme-toggle" data-theme-toggle title="Hell/Dunkel"></button>
    <button type="button" class="header-icon-btn" data-open-settings title="Einstellungen">&#9881;</button>
  </div>
</header>
<main>
  <div class="panel">
    <h2>Filter</h2>
    <form class="inline" id="filter-form"
          hx-get="/hx/statistik" hx-target="#stats-container" hx-swap="innerHTML"
          hx-trigger="submit, load">
      <select id="filter-source" name="source_id"
              hx-get="/hx/filters/sources" hx-trigger="load"
              hx-target="this" hx-swap="innerHTML">
        <option value="">Alle Quellen</option>
      </select>
      <select id="filter-vehicle" name="vehicle"
              hx-get="/hx/filters/vehicles" hx-trigger="load"
              hx-target="this" hx-swap="innerHTML">
        <option value="">Alle Fahrzeuge</option>
      </select>
      <select id="granularity" name="granularity">
        <option value="month">Monatlich</option>
        <option value="year">Jährlich</option>
      </select>
      <button type="submit">Laden</button>
    </form>
  </div>

  <div id="stats-container"></div>
</main>
{% include "_settings_modal.html" %}
<script src="/static/chart.umd.min.js"></script>
<script>
function chartColors() {
  const style = getComputedStyle(document.documentElement);
  return {
    text: style.getPropertyValue('--text').trim() || '#1a1d24',
    muted: style.getPropertyValue('--muted').trim() || '#6b7280',
    grid: style.getPropertyValue('--border').trim() || '#d8dbe2',
  };
}

// Called by hx/statistik/stats.html's own trailing <script> after every
// swap -- the canvases are brand-new elements each time (the whole
// fragment, stat cards/table/charts together, swaps as one unit), so
// there's nothing stale to .destroy() first, unlike the old fetch+build
// version which had to track chart instances across repeated renders of
// the same long-lived canvas.
function renderCharts(data) {
  const colors = chartColors();
  const tickOptions = { color: colors.muted };
  const gridOptions = { color: colors.grid };
  const legendOptions = { position: 'bottom', labels: { color: colors.text } };

  new Chart(document.getElementById('chart-energy'), {
    type: 'bar',
    data: {
      labels: data.labels,
      datasets: [
        { label: 'Netz', data: data.energy_grid, backgroundColor: '#6b7280' },
        { label: 'PV', data: data.energy_pv, backgroundColor: '#16a34a' },
        { label: 'Speicher', data: data.energy_bat, backgroundColor: '#f59e0b' },
        { label: 'Ladepunkt', data: data.energy_cp, backgroundColor: '#2563eb' },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, ticks: tickOptions, grid: gridOptions },
        y: { stacked: true, ticks: tickOptions, grid: gridOptions, title: { display: true, text: 'kWh', color: colors.muted } },
      },
      plugins: { legend: legendOptions },
    },
  });

  // Same colors as chart-energy's Netz/PV/Speicher, no "Ladepunkt" bucket
  // (chargepoint-sourced energy is priced at the battery rate, folded
  // into cost_bat -- see price_entries.corrected_cost_breakdown) and no
  // blue, since blue already means "Ladepunkt" in chart-energy's legend.
  // Under cost_basis="openwb" there's nothing to split, so one flat bar.
  if (data.cost_basis === 'corrected') {
    new Chart(document.getElementById('chart-cost'), {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [
          { label: 'Netz', data: data.cost_grid, backgroundColor: '#6b7280' },
          { label: 'PV', data: data.cost_pv, backgroundColor: '#16a34a' },
          { label: 'Speicher', data: data.cost_bat, backgroundColor: '#f59e0b' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { stacked: true, ticks: tickOptions, grid: gridOptions },
          y: { stacked: true, ticks: tickOptions, grid: gridOptions, title: { display: true, text: '€', color: colors.muted } },
        },
        plugins: { legend: legendOptions },
      },
    });
  } else {
    new Chart(document.getElementById('chart-cost'), {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [{ label: 'Kosten', data: data.cost, backgroundColor: '#2563eb' }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { ticks: tickOptions, grid: gridOptions },
          y: { ticks: tickOptions, grid: gridOptions, title: { display: true, text: '€', color: colors.muted } },
        },
        plugins: { legend: { display: false } },
      },
    });
  }
}
</script>
</body>
</html>
