<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>openWB Ladeprotokoll</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316a34a'/%3E%3Cpath d='M13 3 5 14h5l-1 7 8-11h-5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe2;
    --text: #1a1d24; --muted: #6b7280; --accent: #2563eb;
    --ok: #1e7a42; --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
      --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
      --ok: #5fbd82; --error: #e5675f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #d8dbe2; --muted: #8a8f9c; --accent: #4da3ff;
    --ok: #5fbd82; --error: #e5675f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon { display: flex; flex-shrink: 0; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-mark { font-weight: 700; color: #16a34a; }
  .nav-spacer { margin-left: auto; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  a.nav-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; text-decoration: none;
    display: inline-flex; align-items: center; cursor: pointer;
  }
  a.nav-btn:hover { border-color: var(--accent); }
  main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.numeric, th.numeric { text-align: right; }
  .flagged { color: var(--error); font-weight: 600; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=date], select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  input[type=text] { min-width: 160px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .muted { color: var(--muted); font-size: 12px; }
  .session-count { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .empty-hint { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<script>
try {
  const stored = localStorage.getItem('theme');
  if (stored) document.documentElement.dataset.theme = stored;
} catch (e) {}
</script>
<header>
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#16a34a"/><path d="M13 3 5 14h5l-1 7 8-11h-5z" fill="white"/></svg>
    </span>
    <h1><span class="brand-mark">openWB</span> Ladeprotokoll</h1>
  </div>
  <span class="nav-spacer"></span>
  <div class="header-actions">
    <button type="button" hx-post="/hx/fetch-now" hx-target="#fetch-result" hx-swap="innerHTML" hx-disabled-elt="this">Jetzt abrufen</button>
    <a href="/statistik" class="nav-btn">Statistik</a>
    <a href="/report-review" class="nav-btn">Bericht erstellen &rarr;</a>
    <button type="button" class="header-icon-btn" id="theme-toggle" data-theme-toggle title="Hell/Dunkel"></button>
    <button type="button" class="header-icon-btn" data-open-settings title="Einstellungen">&#9881;</button>
  </div>
</header>
<main>
  <div class="panel">
    <h2>Ladevorgänge</h2>
    <form class="inline" id="filter-form"
          hx-get="/hx/sessions" hx-target="#sessions-panel" hx-swap="innerHTML"
          hx-trigger="submit, sources-changed from:body, load">
      <select id="filter-source" name="source_id"><option value="">Alle Quellen</option></select>
      <select id="filter-vehicle" name="vehicle"><option value="">Alle Fahrzeuge</option></select>
      <select id="filter-chargepoint" name="chargepoint"><option value="">Alle Ladepunkte</option></select>
      <input type="date" id="filter-from" name="from_">
      <input type="date" id="filter-to" name="to">
      <button type="submit">Filtern</button>
      <span class="session-count" id="session-count"></span>
    </form>
    <p class="muted" id="fetch-result"></p>
  </div>

  <div class="panel">
    <div id="sessions-panel"></div>
  </div>
</main>
{% include "_settings_modal.html" %}
<script>
function fmtDateTime(iso) {
  if (!iso) return '–';
  return new Date(iso).toLocaleString('de-DE');
}

function populateSelect(select, values, placeholder) {
  const current = select.value;
  select.innerHTML = `<option value="">${placeholder}</option>`;
  for (const v of values) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  }
  select.value = current;
}

// Re-fetches and rebuilds the filter dropdown + freshness display --
// called at init and whenever the Einstellungen modal's Quellen panel
// changes sources (via the "sources-changed" HX-Trigger event), so this
// page stays in sync without a full reload. The session table itself
// refreshes independently (the filter form's own hx-trigger listens for
// "sources-changed" too).
async function onSourcesChanged() {
  const { sources } = await api('/api/sources');
  const select = document.getElementById('filter-source');
  const current = select.value;
  select.innerHTML = '<option value="">Alle Quellen</option>';
  for (const s of sources) {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    select.appendChild(opt);
  }
  select.value = current;
  updateLastFetchDisplay(sources);
}

// Shows the most recent last_fetch_at across all sources (not just the
// ones touched by a click of "Jetzt abrufen") -- a persistent freshness
// indicator, more useful than a transient "N Quelle(n) erfolgreich
// abgerufen" toast that says nothing once the page has been open a while.
function updateLastFetchDisplay(sources) {
  const resultEl = document.getElementById('fetch-result');
  const timestamps = sources.map((s) => s.last_fetch_at).filter(Boolean);
  if (timestamps.length === 0) {
    resultEl.textContent = 'Noch kein Abruf erfolgt.';
    return;
  }
  const latest = timestamps.reduce((a, b) => (a > b ? a : b));
  const failed = sources.filter((s) => s.enabled && s.last_fetch_status && s.last_fetch_status !== 'ok').length;
  resultEl.textContent = failed === 0
    ? `Letzter Abruf: ${fmtDateTime(latest)}`
    : `Letzter Abruf: ${fmtDateTime(latest)} (${failed} Quelle(n) zuletzt fehlgeschlagen -- Details unter "⚙ Einstellungen")`;
}

async function loadVehicleAndChargepointFilters() {
  // Populated from every session regardless of the vehicle/chargepoint
  // filter itself (chicken-and-egg), but respecting the source filter so
  // the dropdowns don't offer vehicles/Ladepunkte from a different source.
  const params = new URLSearchParams();
  const sourceId = document.getElementById('filter-source').value;
  if (sourceId) params.set('source_id', sourceId);
  const { sessions: all } = await api('/api/sessions?' + params.toString());
  const vehicles = [...new Set(all.map((s) => s.vehicle_name).filter(Boolean))].sort();
  const chargepoints = [...new Set(all.map((s) => s.chargepoint_name).filter(Boolean))].sort();
  populateSelect(document.getElementById('filter-vehicle'), vehicles, 'Alle Fahrzeuge');
  populateSelect(document.getElementById('filter-chargepoint'), chargepoints, 'Alle Ladepunkte');
}

document.getElementById('filter-source').addEventListener('change', () => {
  loadVehicleAndChargepointFilters();
});

document.body.addEventListener('sources-changed', async () => {
  await onSourcesChanged();
  await loadVehicleAndChargepointFilters();
});

(async function init() {
  await onSourcesChanged();
  await loadVehicleAndChargepointFilters();
})();
</script>
</body>
</html>
